name: jada_fit
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # HTTP para las llamadas a tu API
  http: ^1.2.0
  # Secure Storage para guardar el JWT sin riesgos
  flutter_secure_storage: ^9.0.0
  # Provider para gestionar el estado del login
  provider: ^6.1.1
  # Iconos de iOS
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: JadaFont
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700